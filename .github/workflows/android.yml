name: Android CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 25
      uses: actions/setup-java@v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK Platform 37.2
      run: sdkmanager "platforms;android-37.2"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build

  ktlint:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK Platform 37.2
        run: sdkmanager "platforms;android-37.2"
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run ktlint check
        run: ./gradlew ktlintCheck
