name: Android CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

  release-apk-size:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Assemble unsigned release APK
        run: ./gradlew :app:assembleRelease
      - name: Check release APK size
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          from zipfile import ZIP_STORED, ZipFile

          apk = Path("app/build/outputs/apk/release/app-release-unsigned.apk")
          budget = 1_800_000
          size = apk.stat().st_size
          message = f"Release APK size: {size:,} bytes (budget: {budget:,} bytes)"
          print(message)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(message, file=summary)

          with ZipFile(apk) as archive:
              dex = [entry for entry in archive.infolist() if re.fullmatch(r"classes\d*\.dex", entry.filename)]
          if not dex or any(entry.compress_type != ZIP_STORED for entry in dex):
              raise SystemExit("Release APK must contain uncompressed DEX files.")
          if size > budget:
              raise SystemExit(f"Release APK exceeds the size budget by {size - budget:,} bytes.")

  ktlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.4.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Run ktlint check
        run: ./gradlew ktlintCheck
