[versions]
activity = "1.13.0"
android-gradle = "9.3.0"
compose-core = "1.13.0"
hilt = "2.60.1"
health-connect = "1.1.0"
junit = "4.13.2"
kotlin = "2.3.21"
ktlint = "14.2.0"
ksp = "2.3.11"
lifecycle = "2.10.0"
logcat = "0.1"
room = "2.7.2"

[libraries]
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
android-gradle = { module = "com.android.tools.build:gradle", version.ref = "android-gradle" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-core"}
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-core" }
hilt-compiler = { module ="com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-core = { module ="com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-gradle = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
health-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "health-connect" }
junit = { module = "junit:junit", version.ref = "junit" }
logcat = { module = "com.squareup.logcat:logcat", version.ref = "logcat" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-core = { module = "androidx.room:room-ktx", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
viewmodel-core = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

[plugins]
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
